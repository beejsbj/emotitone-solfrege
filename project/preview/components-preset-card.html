<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.preset{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--ink-3);box-shadow:var(--ring);border-radius:12px;border-left:3px solid var(--ivory);}
.preset .name{flex:1;font:var(--t-h2);letter-spacing:.02em;text-transform:uppercase;color:var(--fg);}
.preset .apply{padding:8px 14px;font:var(--t-label);letter-spacing:var(--tracking-label);text-transform:uppercase;background:transparent;color:var(--fg-2);box-shadow:var(--ring);border-radius:8px;border:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
</style></head><body>
<div class="card">
  <div class="label" style="margin-bottom:12px">PRESET CARDS</div>
  <div class="grid2">
    <div class="preset"><div class="name">SOFT GLASS</div><button class="apply">APPLY</button></div>
    <div class="preset"><div class="name">PULSE LAB</div><button class="apply">APPLY</button></div>
    <div class="preset"><div class="name">AMBIENT B…</div><button class="apply">APPLY</button></div>
    <div class="preset"><div class="name">NEON SCO…</div><button class="apply">APPLY</button></div>
  </div>
</div></body></html>
