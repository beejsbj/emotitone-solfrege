<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 12px;">
    <div><div class="swatch" style="background:#d8362a;height:80px;width:100%"></div><div class="label" style="margin-top:10px">TOMATO</div><code style="font:var(--t-mono);color:var(--fg-3)">#d8362a</code></div>
    <div><div class="swatch" style="background:#f2b134;height:80px;width:100%"></div><div class="label" style="margin-top:10px">SAFFRON</div><code style="font:var(--t-mono);color:var(--fg-3)">#f2b134</code></div>
    <div><div class="swatch" style="background:#6b3fa0;height:80px;width:100%"></div><div class="label" style="margin-top:10px">PLUM</div><code style="font:var(--t-mono);color:var(--fg-3)">#6b3fa0</code></div>
    <div><div class="swatch" style="background:#efe6d0;height:80px;width:100%"></div><div class="label" style="margin-top:10px">BONE</div><code style="font:var(--t-mono);color:var(--fg-3)">#efe6d0</code></div>
  </div>
  <div style="margin-top:14px; font: var(--t-caption); color: var(--fg-3);">Brand surfaces only — splash, empty states, decorative scrap. Never functional UI.</div>
</div></body></html>
