<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns: repeat(5, 1fr); gap: 10px;">
    <div><div class="swatch" style="background:#0a0a0a"></div><div class="label" style="margin-top:8px">INK</div><code style="font:var(--t-mono);color:var(--fg-3)">#0a0a0a</code></div>
    <div><div class="swatch" style="background:#141414"></div><div class="label" style="margin-top:8px">INK&nbsp;2</div><code style="font:var(--t-mono);color:var(--fg-3)">#141414</code></div>
    <div><div class="swatch" style="background:#1f1f1f"></div><div class="label" style="margin-top:8px">INK&nbsp;3</div><code style="font:var(--t-mono);color:var(--fg-3)">#1f1f1f</code></div>
    <div><div class="swatch" style="background:#2a2a2a"></div><div class="label" style="margin-top:8px">INK&nbsp;4</div><code style="font:var(--t-mono);color:var(--fg-3)">#2a2a2a</code></div>
    <div><div class="swatch" style="background:#3a3a3a"></div><div class="label" style="margin-top:8px">INK&nbsp;5</div><code style="font:var(--t-mono);color:var(--fg-3)">#3a3a3a</code></div>
  </div>
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top:14px;">
    <div><div class="swatch" style="background:#f6f1e6"></div><div class="label" style="margin-top:8px">IVORY</div><code style="font:var(--t-mono);color:var(--fg-3)">#f6f1e6</code></div>
    <div><div class="swatch" style="background:#e8e0d0"></div><div class="label" style="margin-top:8px">IVORY&nbsp;2</div><code style="font:var(--t-mono);color:var(--fg-3)">#e8e0d0</code></div>
    <div><div class="swatch" style="background:#b8b0a0"></div><div class="label" style="margin-top:8px">IVORY&nbsp;3</div><code style="font:var(--t-mono);color:var(--fg-3)">#b8b0a0</code></div>
    <div><div class="swatch" style="background:#6a655c"></div><div class="label" style="margin-top:8px">IVORY&nbsp;4</div><code style="font:var(--t-mono);color:var(--fg-3)">#6a655c</code></div>
  </div>
</div></body></html>
