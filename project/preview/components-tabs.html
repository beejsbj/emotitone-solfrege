<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .tabs{display:flex;gap:0;background:var(--ink-3);padding:6px;border-radius:12px;box-shadow:var(--ring);}
  .tab{flex:1;padding:10px 14px;font:var(--t-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-3);text-align:center;cursor:pointer;}
  .tab.active{
    color:var(--ink);
    background:var(--ivory);
    clip-path: polygon(4% 0%, 98% 6%, 100% 90%, 96% 100%, 2% 94%, 0% 8%);
    transform: skewX(-2deg);
    box-shadow: var(--shadow-cut);
  }
</style></head><body>
<div class="card">
  <div class="label" style="margin-bottom:12px">PERSONA-5 SWAP</div>
  <div class="tabs">
    <div class="tab">ANIM</div>
    <div class="tab active">FREQ</div>
    <div class="tab">COLOR</div>
    <div class="tab">POPUP</div>
    <div class="tab">SCOPE</div>
  </div>
  <div class="caption" style="margin-top:10px;">Selected tab is physically off-cut: skewed, lifted, ivory paper.</div>
</div></body></html>
