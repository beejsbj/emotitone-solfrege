<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .k{height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:var(--t-h2);text-transform:uppercase;color:#fff;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);
    clip-path: polygon(3% 1%, 98% 2%, 100% 98%, 1% 99%);
    position:relative;}
  .k small{font:var(--t-caption);opacity:.85;margin-left:4px;}
</style></head><body>
<div class="card">
  <div class="label" style="margin-bottom:10px">KEYBOARD KEYS · MAIN OCTAVE</div>
  <div class="keys">
    <div class="k" style="background:hsl(18 85% 56%)">DO<small>C4</small></div>
    <div class="k" style="background:hsl(78 72% 52%)">RE<small>D4</small></div>
    <div class="k" style="background:hsl(138 60% 46%)">MI<small>E4</small></div>
    <div class="k" style="background:hsl(178 68% 50%)">FA<small>F4</small></div>
    <div class="k" style="background:hsl(252 72% 60%)">SOL<small>G4</small></div>
    <div class="k" style="background:hsl(312 76% 58%)">LA<small>A4</small></div>
    <div class="k" style="background:hsl(2 86% 58%)">TI<small>B4</small></div>
  </div>
  <div class="caption" style="margin-top:10px">Cut-paper clip-path · inset bottom shadow · color = scale degree.</div>
</div></body></html>
