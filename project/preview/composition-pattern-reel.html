<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
.pattern-merge {
  color: var(--ivory);
}

.pattern-merge * {
  box-sizing: border-box;
}

.pattern-merge .card-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: var(--s-6);
  margin-bottom: var(--s-7);
}

.pattern-merge .kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font: var(--t-label);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ivory-3);
  margin-bottom: var(--s-4);
}

.pattern-merge .kicker-dot {
  width: 8px;
  height: 8px;
  background: var(--tomato);
  display: inline-block;
}

.pattern-merge h2 {
  margin: 0;
  max-width: 15ch;
  font: var(--t-display-l);
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
  color: var(--ivory);
}

.pattern-merge .head-meta {
  font: var(--t-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ivory-3);
  text-align: right;
}

/* Specimen outer = canonical .panel (in _card.css) + box-shadow + extra padding */
.pattern-merge .panel {
  box-shadow: var(--ring);
  padding: 28px 24px 22px;
  margin-top: 0;       /* outer container — no margin needed */
}

.pattern-merge .reel-head {
  display: flex;
  align-items: baseline;
  gap: var(--s-5);
  padding-bottom: var(--s-5);
  border-bottom: 1px solid var(--hairline);
  margin-bottom: var(--s-5);
}

.pattern-merge .reel-title {
  font: var(--t-h2);
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
  color: var(--ivory);
}

.pattern-merge .reel-count {
  margin-left: auto;
  font: var(--t-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ivory-3);
}

.pattern-merge .stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pattern-merge .stack-card {
  appearance: none;
  position: relative;
  width: 100%;
  height: 58px;
  border: 1px solid var(--hairline);
  background: var(--ink-2);
  color: var(--ivory);
  display: grid;
  grid-template-columns: 4px 56px minmax(0, 1fr) 156px 74px;
  align-items: center;
  gap: var(--s-5);
  padding: 0 14px 0 0;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transform-origin: 50% 0;
  transition:
    transform var(--dur-panel) var(--ease-swing),
    opacity var(--dur-panel) var(--ease-brush),
    border-color var(--dur-ui) var(--ease-brush),
    background var(--dur-ui) var(--ease-brush);
}

.pattern-merge .stack-card.s-3 {
  transform: rotate(-0.35deg) scale(0.965);
  opacity: 0.62;
}

.pattern-merge .stack-card.s-2 {
  transform: rotate(0.25deg) scale(0.985);
  opacity: 0.80;
}

.pattern-merge .stack-card.s-1 {
  transform: rotate(-0.15deg) scale(1);
  opacity: 1;
}

.pattern-merge .stack-card:hover,
.pattern-merge .stack-card:focus-visible {
  transform: translateY(-6px) rotate(0deg) scale(1);
  opacity: 1;
  border-color: var(--ink-5);
  background: var(--ink-4);
  outline: none;
}

.pattern-merge .spine {
  align-self: stretch;
  display: block;
}

.pattern-merge .num {
  font: var(--t-display-m);
  line-height: 0.9;
  color: var(--ivory-4);
  text-align: center;
  text-transform: uppercase;
}

.pattern-merge .name {
  display: block;
  min-width: 0;
  font: var(--t-h2);
  line-height: 1;
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
  color: var(--ivory);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pattern-merge .sub {
  display: block;
  margin-top: 3px;
  font: var(--t-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  line-height: 1.2;
  text-transform: uppercase;
  color: var(--ivory-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pattern-merge .mini-roll,
.pattern-merge .big-roll {
  display: flex;
  align-items: flex-end;
  border-left: 1px solid var(--hairline);
  border-right: 1px solid var(--hairline);
}

.pattern-merge .mini-roll {
  height: 28px;
  gap: 2px;
  padding: 0 var(--s-2);
}

.pattern-merge .mini-roll i,
.pattern-merge .big-roll i {
  display: block;
  flex: 1;
  min-width: 4px;
}

.pattern-merge .when {
  font: var(--t-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ivory-3);
  text-align: right;
}

.pattern-merge .restline {
  display: flex;
  align-items: center;
  gap: var(--s-5);
  margin: var(--s-5) 0;
  font: var(--t-mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ivory-3);
}

.pattern-merge .restline::before,
.pattern-merge .restline::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--hairline);
}

.pattern-merge .active-card {
  position: relative;
  border: 1px solid var(--ivory-3);
  background: var(--ink-4);
  box-shadow: var(--ring), 0 8px 0 var(--ink);
  padding: 18px 18px 16px 22px;
  animation: active-rise var(--dur-panel) var(--ease-swing);
}

.pattern-merge .active-card .spine {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

.pattern-merge .active-head {
  display: flex;
  align-items: center;
  gap: var(--s-6);
}

.pattern-merge .active-card .num {
  font: var(--t-display-l);
  line-height: 0.9;
  color: var(--ivory-3);
}

.pattern-merge .active-copy {
  flex: 1;
  min-width: 0;
}

.pattern-merge .active-card .name {
  font: var(--t-display-m);
}

.pattern-merge .icon-row {
  display: flex;
  gap: var(--s-3);
}

.pattern-merge .icon-btn {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--hairline);
  border-radius: 0;
  background: transparent;
  color: var(--ivory-2);
  cursor: pointer;
}

.pattern-merge .icon-btn:hover,
.pattern-merge .icon-btn:focus-visible {
  border-color: var(--ivory-3);
  color: var(--ivory);
  outline: none;
}

.pattern-merge .icon-btn svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: butt;
  stroke-linejoin: miter;
}

.pattern-merge .big-roll {
  height: 84px;
  gap: 3px;
  padding: 0 var(--s-2);
  margin: var(--s-6) 0 var(--s-5);
}

.pattern-merge .active-foot {
  display: flex;
  align-items: center;
  gap: var(--s-5);
  border-top: 1px solid var(--hairline);
  padding-top: var(--s-5);
}

.pattern-merge .play {
  border: 1px solid var(--ivory-3);
  border-radius: 0;
  background: var(--ivory);
  color: var(--ink);
  padding: 8px 14px;
  font: var(--t-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  cursor: pointer;
}

.pattern-merge .position {
  font: var(--t-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ivory-3);
}

.pattern-merge .rec {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
  padding: 4px 10px;
  font: var(--t-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-radius: 0;
}

.pattern-merge .rec::before {
  content: "";
  width: 8px;
  height: 8px;
  background: var(--brass-edge);
}

.pattern-merge .caption {
  margin-top: var(--s-6);
  font: var(--t-caption);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ivory-3);
}

@keyframes active-rise {
  from {
    transform: translateY(-8px);
    opacity: 0.72;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  .pattern-merge .stack-card,
  .pattern-merge .active-card {
    transition-duration: 0ms;
    animation: none;
  }
}
</style></head><body>
<div class="card pattern-merge">
  <div class="label">COMPOSITION · 08 PATTERN REEL</div>

  <div class="card-head">
    <div>
      <div class="kicker"><span class="kicker-dot"></span>Stacked deck · active bottom</div>
      <h2>A deck you flip through</h2>
    </div>
    <div class="head-meta" id="reelMeta">4 patterns<br>last 12h</div>
  </div>

  <section class="panel" aria-label="Interactive pattern reel">
    <span class="panel-label">The reel · interactive</span>

    <div class="reel-head">
      <span class="reel-title">Patterns</span>
      <span class="reel-count" id="reelCount">3 stacked · 1 active</span>
    </div>

    <div class="stack" id="patternStack"></div>
    <div class="restline">Active rests at the bottom</div>
    <div id="activeMount"></div>
  </section>

  <div class="caption">Click a stacked card to promote it. The previous active card demotes into the stack.</div>
</div>

<script>
(function () {
  const patterns = {
    glass: {
      num: "2I",
      name: "Glass Bell",
      sub: "F# DORIAN / 96 BPM / 8 BARS",
      when: "2d ago",
      spine: "var(--tomato)",
      roll: [
        ["40%", "var(--note-re)"],
        ["70%", "var(--note-mi)"],
        ["30%", "var(--note-do)"],
        ["80%", "var(--note-fa)"],
        ["50%", "var(--note-re)"],
        ["60%", "var(--note-la)"],
        ["35%", "var(--note-mi)"],
        ["75%", "var(--note-ti)"]
      ]
    },
    tram: {
      num: "I2",
      name: "Late Night Tram",
      sub: "A MINOR / 72 BPM / 16 BARS",
      when: "5h ago",
      spine: "var(--tomato)",
      roll: [
        ["30%", "var(--note-sol)"],
        ["60%", "var(--note-la)"],
        ["80%", "var(--note-ti)"],
        ["40%", "var(--note-sol)"],
        ["70%", "var(--note-la)"],
        ["25%", "var(--note-do)"],
        ["55%", "var(--note-re)"],
        ["65%", "var(--note-mi)"]
      ]
    },
    hilbert: {
      num: "II",
      name: "Hilbert Tape",
      sub: "D# LYDIAN / 132 BPM / 4 BARS",
      when: "just now",
      spine: "var(--plum)",
      roll: [
        ["70%", "var(--note-fa)"],
        ["50%", "var(--note-mi)"],
        ["90%", "var(--note-re)"],
        ["30%", "var(--note-do)"],
        ["60%", "var(--note-fa)"],
        ["75%", "var(--note-la)"],
        ["45%", "var(--note-ti)"],
        ["80%", "var(--note-re)"]
      ]
    },
    brass: {
      num: "I0",
      name: "Brass Whistle",
      sub: "E LOCRIAN / 120 BPM / 8 BARS / PIANO",
      when: "active",
      spine: "var(--tomato)",
      roll: [
        ["55%", "var(--note-do)"],
        ["80%", "var(--note-re)"],
        ["30%", "var(--note-mi)"],
        ["70%", "var(--note-fa)"],
        ["90%", "var(--note-sol)"],
        ["40%", "var(--note-la)"],
        ["65%", "var(--note-ti)"],
        ["50%", "var(--note-do)"],
        ["75%", "var(--note-re)"],
        ["35%", "var(--note-mi)"],
        ["60%", "var(--note-fa)"],
        ["85%", "var(--note-sol)"],
        ["45%", "var(--note-la)"],
        ["70%", "var(--note-ti)"],
        ["55%", "var(--note-do)"],
        ["80%", "var(--note-re)"]
      ]
    }
  };

  let stackOrder = ["glass", "tram", "hilbert"];
  let activeId = "brass";

  const stack = document.getElementById("patternStack");
  const activeMount = document.getElementById("activeMount");

  function rollMarkup(pattern, isBig) {
    const bars = isBig ? pattern.roll.concat(pattern.roll).slice(0, 16) : pattern.roll;
    return bars.map(([height, color]) => (
      '<i style="height:' + height + ';background:' + color + '"></i>'
    )).join("");
  }

  function stackCard(id, index) {
    const pattern = patterns[id];
    const distance = stackOrder.length - 1 - index;
    const depth = distance === 0 ? "s-1" : distance === 1 ? "s-2" : "s-3";
    return '' +
      '<button class="stack-card ' + depth + '" type="button" data-id="' + id + '">' +
        '<span class="spine" style="background:' + pattern.spine + '"></span>' +
        '<span class="num">' + pattern.num + '</span>' +
        '<span>' +
          '<span class="name">' + pattern.name + '</span>' +
          '<span class="sub">' + pattern.sub + '</span>' +
        '</span>' +
        '<span class="mini-roll" aria-hidden="true">' + rollMarkup(pattern, false) + '</span>' +
        '<span class="when">' + pattern.when + '</span>' +
      '</button>';
  }

  function activeCard(id) {
    const pattern = patterns[id];
    return '' +
      '<article class="active-card">' +
        '<span class="spine" style="background:' + pattern.spine + '"></span>' +
        '<div class="active-head">' +
          '<span class="num">' + pattern.num + '</span>' +
          '<div class="active-copy">' +
            '<div class="name">' + pattern.name + '</div>' +
            '<div class="sub">' + pattern.sub + '</div>' +
          '</div>' +
          '<div class="icon-row" aria-label="Pattern controls">' +
            '<button class="icon-btn" type="button" title="Arm take" aria-label="Arm take"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4"></circle></svg></button>' +
            '<button class="icon-btn" type="button" title="Duplicate" aria-label="Duplicate"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5H11V13H3Z"></path><path d="M5 3H13V11"></path></svg></button>' +
            '<button class="icon-btn" type="button" title="Send down" aria-label="Send down"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2V12"></path><path d="M4 8L8 12L12 8"></path></svg></button>' +
          '</div>' +
        '</div>' +
        '<div class="big-roll" aria-hidden="true">' + rollMarkup(pattern, true) + '</div>' +
        '<div class="active-foot">' +
          '<button class="play" type="button">Play</button>' +
          '<span class="position">Bar 03 / 08 · Steps 16/16</span>' +
          '<span class="rec brass">Rec armed</span>' +
        '</div>' +
      '</article>';
  }

  function render() {
    stack.innerHTML = stackOrder.map(stackCard).join("");
    activeMount.innerHTML = activeCard(activeId);
  }

  stack.addEventListener("click", function (event) {
    const card = event.target.closest(".stack-card");
    if (!card) return;
    const nextActiveId = card.dataset.id;
    stackOrder = stackOrder.filter((id) => id !== nextActiveId);
    stackOrder.push(activeId);
    activeId = nextActiveId;
    render();
  });

  render();
})();
</script>
</body></html>
