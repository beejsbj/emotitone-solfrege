<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .ico{width:40px;height:40px;display:grid;place-items:center;background:var(--ink-3);box-shadow:var(--ring);border-radius:8px;border:0;color:var(--fg);cursor:pointer;}
  .ico.sm{width:32px;height:32px;border-radius:6px;}
  .ico.lg{width:48px;height:48px;}
  .ico.paper{background:var(--ivory);color:var(--ink);box-shadow:none;}
  .ico.wire{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-5);color:var(--fg-2);}
  /* brass record uses the .brass utility from _card.css for sheen */
  .ico.brass{color:var(--brass-edge);}
  .ico.wire-erase{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ivory-3);color:var(--ivory-2);}
  .ico.active{background:var(--ink-4);box-shadow:inset 0 0 0 1px var(--ink-5);}
  .pair{display:flex;gap:0;background:var(--ink-3);box-shadow:var(--ring);border-radius:8px;overflow:hidden;}
  .pair .ico{background:transparent;box-shadow:none;border-radius:0;}
  .pair .ico+.ico{border-left:1px solid var(--hairline);}
  .lbl{font:var(--t-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-3);}
</style></head><body>
<div class="card">
  <div class="lbl">ROLES · PAPER PRIMARY · WIRE SECONDARY · BRASS CAPTURE · WIRE ERASE</div>
  <div class="row">
    <button class="ico paper" title="Play (primary)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button>
    <button class="ico wire" title="Pause (secondary)"><svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="1" width="3.5" height="12" fill="currentColor"/><rect x="7.5" y="1" width="3.5" height="12" fill="currentColor"/></svg></button>
    <button class="ico brass" title="Record (the lone brass — captured)"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="currentColor"/></svg></button>
    <button class="ico wire-erase" title="Erase (destructive)"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <span style="width:8px"></span>
    <button class="ico" title="Undo"><svg width="16" height="14" viewBox="0 0 16 14"><path d="M3 5h7a4 4 0 0 1 0 8h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 2 1 5l4 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ico" title="Save"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2h8l2 2v8H2z" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="2" width="6" height="4" fill="currentColor"/></svg></button>
    <button class="ico" title="Settings"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2M2.5 2.5l1.5 1.5M10 10l1.5 1.5M2.5 11.5 4 10M10 4l1.5-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button class="ico" title="Menu"><svg width="14" height="12" viewBox="0 0 14 12"><path d="M1 2h12M1 6h12M1 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button class="ico active" title="Active state"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="3" fill="currentColor"/></svg></button>
  </div>

  <div class="lbl" style="margin-top:18px">SIZES · SM 32 · MD 40 · LG 48 · CRISP 8R</div>
  <div class="row">
    <button class="ico sm"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M2 1v9l7-4.5z" fill="currentColor"/></svg></button>
    <button class="ico"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button>
    <button class="ico lg paper"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 2v14l11-7z" fill="currentColor"/></svg></button>
    <span style="width:12px"></span>
    <div class="pair">
      <button class="ico sm" title="Up oct"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 1l4 5H1z" fill="currentColor"/></svg></button>
      <button class="ico sm" title="Down oct"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 9 1 4h8z" fill="currentColor"/></svg></button>
    </div>
    <div class="pair">
      <button class="ico sm"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="2" width="2" height="6" fill="currentColor"/><rect x="4" y="2" width="2" height="6" fill="currentColor"/><rect x="7" y="2" width="2" height="6" fill="currentColor"/></svg></button>
      <button class="ico sm"><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="2" cy="5" r="1.5" fill="currentColor"/><circle cx="5" cy="5" r="1.5" fill="currentColor"/><circle cx="8" cy="5" r="1.5" fill="currentColor"/></svg></button>
      <button class="ico sm"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8M1 5l3-3M1 5l3 3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <div class="caption" style="margin-top:14px;color:var(--fg-3)">Paper = primary (rare). Wire = secondary. <b>Brass = the lone accent</b> — record/capture only, with sheen. Erase is wire-outlined neutral. Default ink-3 holds everything else. Press: shrink 96%.</div>
</div></body></html>
